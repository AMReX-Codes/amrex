name: Save clang-tidy database
description: >-
  Upload this job's clang-tidy database, or its ccache log when the job
  failed.  Call it with "if: not cancelled" and job-status set to job.status.
inputs:
  job-status:
    description: job.status of the calling job
    required: true
runs:
  using: composite
  steps:
    - name: Save clang-tidy database
      if: inputs.job-status == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: clang-tidy-db-${{ github.workflow }}-${{ github.job }}
        path: ${{ runner.temp }}/clang-tidy-db/out
        retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
        if-no-files-found: ignore
        overwrite: true  # a re-run of the job
    - name: Save ccache log
      if: inputs.job-status == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccache-log-${{ github.workflow }}-${{ github.job }}
        path: ${{ github.workspace }}/ccache.log.txt
        retention-days: 2
        if-no-files-found: ignore
        overwrite: true
