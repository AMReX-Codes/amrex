name: bittree

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-bittree
  cancel-in-progress: true

permissions:
  actions: read  # clang-tidy database artifacts
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml

  bittree-2d:
    name: Bittree 2D
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        .github/workflows/dependencies/dependencies_clang-tidy-apt-llvm.sh 21
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Check out Bittree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Flash-X/Bittree
        path: bittree
    - name: Build Bittree
      run: |
        cd ${{ github.workspace }}/bittree
        python setup.py library --dim 2 --prefix ${{ github.workspace }}/libbittree
        cd build
        make -j4
        make install
    - name: Fetch clang-tidy databases
      uses: ./.github/actions/clang-tidy-db/fetch
    - name: Build and Run Test
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=80M
        clang-tidy-21 --version > ${{ runner.temp }}/clang-tidy-version.txt
        export CCACHE_EXTRAFILES=${{ github.workspace }}/.clang-tidy:${{ runner.temp }}/clang-tidy-version.txt
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log.txt
        ccache -z

        export AMREX_BITTREE_HOME=${{ github.workspace }}/libbittree
        cd ${{ github.workspace }}/Tests/Amr/Advection_AmrCore/Exec
        make -j4 USE_MPI=TRUE USE_BITTREE=TRUE DIM=2 TEST=TRUE \
            CCACHE=ccache CXXSTD=c++20
        mpiexec -n 2 ./main2d.gnu.TEST.MPI.ex inputs_bittree amr.plot_int=1000

        ccache -s
        du -hs ~/.cache/ccache
    - name: Clang-tidy
      run: |
        ${{github.workspace}}/.github/workflows/clang-tidy/clang-tidy-ccache-misses.sh clang-tidy-21 \
            "--config-file=${{github.workspace}}/.clang-tidy --warnings-as-errors=*"
    - name: Save clang-tidy database
      if: ${{ !cancelled() }}
      uses: ./.github/actions/clang-tidy-db/save
      with:
        job-status: ${{ job.status }}

  bittree-3d:
    name: Bittree 3D
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        .github/workflows/dependencies/dependencies_clang-tidy-apt-llvm.sh 21
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Check out Bittree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Flash-X/Bittree
        path: bittree
    - name: Build Bittree
      run: |
        cd ${{ github.workspace }}/bittree
        python setup.py library --dim 3 --prefix ${{ github.workspace }}/libbittree
        cd build
        make -j4
        make install
    - name: Fetch clang-tidy databases
      uses: ./.github/actions/clang-tidy-db/fetch
    - name: Build and Run Test
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=80M
        clang-tidy-21 --version > ${{ runner.temp }}/clang-tidy-version.txt
        export CCACHE_EXTRAFILES=${{ github.workspace }}/.clang-tidy:${{ runner.temp }}/clang-tidy-version.txt
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log.txt
        ccache -z

        export AMREX_BITTREE_HOME=${{ github.workspace }}/libbittree
        cd ${{ github.workspace }}/Tests/Amr/Advection_AmrCore/Exec
        make -j4 USE_MPI=TRUE USE_BITTREE=TRUE DIM=3 TEST=TRUE BL_NO_FORT=TRUE\
            CCACHE=ccache CXXSTD=c++20
        mpiexec -n 2 ./main3d.gnu.TEST.MPI.ex inputs_bittree max_step=10

        ccache -s
        du -hs ~/.cache/ccache
    - name: Clang-tidy
      run: |
        ${{github.workspace}}/.github/workflows/clang-tidy/clang-tidy-ccache-misses.sh clang-tidy-21 \
            "--config-file=${{github.workspace}}/.clang-tidy --warnings-as-errors=*"
    - name: Save clang-tidy database
      if: ${{ !cancelled() }}
      uses: ./.github/actions/clang-tidy-db/save
      with:
        job-status: ${{ job.status }}
