  # Build libamrex and all tests
  tests_clang:
    name: MSVC Clang w/o Fortran w/o MPI
    runs-on: windows-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@v7
    - uses: seanmiddleditch/gha-setup-ninja@master
    - name: Set Up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build & Install
      shell: cmd
      run: |
        cmake -S . -B build   ^
              -G Ninja                  ^
              -DCMAKE_C_COMPILER=clang-cl ^
              -DCMAKE_CXX_COMPILER=clang-cl ^
              -DCMAKE_CXX_STANDARD=20       ^
              -DCMAKE_BUILD_TYPE=Release    ^
              -DBUILD_SHARED_LIBS=ON        ^
              -DCMAKE_VERBOSE_MAKEFILE=ON   ^
              -DAMReX_EB=ON                 ^
              -DAMReX_ENABLE_TESTS=ON       ^
              -DAMReX_FORTRAN=OFF           ^
              -DAMReX_MPI=OFF               ^
              -DAMReX_OMP=ON
        cmake --build build -j 4

        cmake --build build --target install

        set "PATH=%PATH%;D:\\a\amrex\amrex\installdir\bin"
        cmake --build build --target test_install
        ctest --test-dir build --output-on-failure

  tests_cuda:
    name: CUDA on Windows
    runs-on: windows-2022
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@v7
    - uses: Jimver/cuda-toolkit@v0.2.35
      id: cuda-toolkit
      with:
        cuda: '12.6.1'
        sub-packages: '["nvcc", "cudart", "cuda_profiler_api", "cufft_dev", "cusparse_dev", "curand_dev"]'
        method: 'network'
        use-github-cache: 'false'
    - name: Install Ninja
      run: |
        curl.exe -L -o ninja-win.zip https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip
        Expand-Archive -Path ninja-win.zip -DestinationPath .
        echo "$pwd" >> $env:GITHUB_PATH
    - name: Set Up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Set Up MS-MPI
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: msmpi
    - name: Compile
      run: |
        cmake -S . -B build                       `
              -G "Ninja"                          `
              -DCMAKE_CXX_STANDARD=20             `
              -DCMAKE_VERBOSE_MAKEFILE=ON         `
              -DCMAKE_BUILD_TYPE=Release          `
              -DAMReX_GPU_BACKEND=CUDA            `
              -DAMReX_CUDA_ARCH="8.0"             `
              -DAMReX_ENABLE_TESTS=ON             `
              -DAMReX_EB=ON                       `
              -DAMReX_FFT=ON                      `
              -DAMReX_LINEAR_SOLVERS=ON           `
              -DAMReX_PARTICLES=ON                `
              -DAMReX_FORTRAN=OFF                 `
              -DAMReX_MPI=ON                      `
              -DCMAKE_CXX_COMPILER=cl             `
              -DCMAKE_CUDA_COMPILER=nvcc
        # Sometimes cmake fails, but powershell continues to run
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cmake --build build --config Release -j 4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cmake --build build --config Release --target install
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
