name: windows

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml

  # Build libamrex and all tests
  tests_msvc:
    name: MSVC w/o Fortran w/o MPI
    runs-on: windows-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # ccache was disabled for the Windows jobs in #3566.
    - name: Build & Install
      run: |
        cmake -S . -B build   `
              -DCMAKE_CXX_STANDARD=20       `
              -DBUILD_SHARED_LIBS=ON        `
              -DCMAKE_VERBOSE_MAKEFILE=ON   `
              -DAMReX_EB=OFF                `
              -DAMReX_ENABLE_TESTS=ON       `
              -DAMReX_FORTRAN=OFF           `
              -DAMReX_MPI=OFF
        cmake --build build --config RelWithDebInfo -j 4

        cmake --build build --config RelWithDebInfo --target install

        $Env:PATH += ";D:\\a\amrex\amrex\installdir\bin"
        cmake --build build --config RelWithDebInfo --target test_install
        ctest --test-dir build -C RelWithDebInfo --output-on-failure

  # Build libamrex and all test (static)
  test_msvc_static:
    name: MSVC w/o Fortran w/o MPI static
    runs-on: windows-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # ccache was disabled for the Windows jobs in #3566.
    - name: Build & Install
      run: |
        cmake -S . -B build   `
              -DCMAKE_CXX_STANDARD=20       `
              -DCMAKE_VERBOSE_MAKEFILE=ON   `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DAMReX_EB=ON                 `
              -DAMReX_ENABLE_TESTS=ON       `
              -DAMReX_FORTRAN=OFF           `
              -DAMReX_MPI=OFF
        cmake --build build --config RelWithDebInfo -j 4

        cmake --build build --config RelWithDebInfo --target install
        cmake --build build --config RelWithDebInfo --target test_install
        ctest --test-dir build -C RelWithDebInfo --output-on-failure

  # Build libamrex and all tests
  tests_clang:
    name: MSVC Clang w/o Fortran w/o MPI
    runs-on: windows-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
    - name: Set Up MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Build & Install
      shell: cmd
      run: |
        cmake -S . -B build   ^
              -G Ninja                  ^
              -DCMAKE_C_COMPILER=clang-cl ^
              -DCMAKE_CXX_COMPILER=clang-cl ^
              -DCMAKE_CXX_STANDARD=20       ^
              -DCMAKE_BUILD_TYPE=Release    ^
              -DBUILD_SHARED_LIBS=ON        ^
              -DCMAKE_VERBOSE_MAKEFILE=ON   ^
              -DAMReX_EB=ON                 ^
              -DAMReX_ENABLE_TESTS=ON       ^
              -DAMReX_FORTRAN=OFF           ^
              -DAMReX_MPI=OFF               ^
              -DAMReX_OMP=ON
        cmake --build build -j 4

        cmake --build build --target install

        set "PATH=%PATH%;D:\\a\amrex\amrex\installdir\bin"
        cmake --build build --target test_install
        ctest --test-dir build --output-on-failure

  tests_cuda:
    name: CUDA on Windows
    runs-on: windows-2022
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
      id: cuda-toolkit
      with:
        cuda: '12.6.1'
        sub-packages: '["nvcc", "cudart", "cuda_profiler_api", "cufft_dev", "cusparse_dev", "curand_dev"]'
        method: 'network'
        use-github-cache: 'false'
    - name: Install Ninja
      run: |
        curl.exe -L -o ninja-win.zip https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip
        Expand-Archive -Path ninja-win.zip -DestinationPath .
        echo "$pwd" >> $env:GITHUB_PATH
    - name: Set Up MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Set Up MS-MPI
      uses: mpi4py/setup-mpi@3417e34f1394a16723d7913c236642c24e95fd5a # v1.4.4
      with:
        mpi: msmpi
    - name: Compile
      run: |
        cmake -S . -B build                       `
              -G "Ninja"                          `
              -DCMAKE_CXX_STANDARD=20             `
              -DCMAKE_VERBOSE_MAKEFILE=ON         `
              -DCMAKE_BUILD_TYPE=Release          `
              -DAMReX_GPU_BACKEND=CUDA            `
              -DCMAKE_CUDA_ARCHITECTURES=80        `
              -DAMReX_ENABLE_TESTS=ON             `
              -DAMReX_EB=ON                       `
              -DAMReX_FFT=ON                      `
              -DAMReX_LINEAR_SOLVERS=ON           `
              -DAMReX_PARTICLES=ON                `
              -DAMReX_FORTRAN=OFF                 `
              -DAMReX_MPI=ON                      `
              -DCMAKE_CXX_COMPILER=cl             `
              -DCMAKE_CUDA_COMPILER=nvcc
        # Sometimes cmake fails, but powershell continues to run
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cmake --build build --config Release -j 4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cmake --build build --config Release --target install
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
