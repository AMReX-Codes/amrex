name: PETSc

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-petsc
  cancel-in-progress: true

permissions:
  actions: read  # clang-tidy database artifacts
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml

  test-petsc-cpu-2d:
    name: GCC 2D EB PETSc
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        .github/workflows/dependencies/dependencies_clang-tidy-apt-llvm.sh 21
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build PETSc
      run: |
        sudo apt-get install -y --no-install-recommends libblas-dev liblapack-dev
        wget -q https://github.com/petsc/petsc/archive/refs/tags/v3.22.2.tar.gz
        tar xfz v3.22.2.tar.gz
        cd petsc-3.22.2
        export PETSC_DIR=${PWD}
        ./configure --prefix=${PWD}/petsc --with-fortran-bindings=no --with-x=no
        make -j 4
        make install
        cd ../
    - name: Fetch clang-tidy databases
      uses: ./.github/actions/clang-tidy-db/fetch
    - name: Build and Run Test
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=90M
        clang-tidy-21 --version > ${{ runner.temp }}/clang-tidy-version.txt
        export CCACHE_EXTRAFILES=${{ github.workspace }}/.clang-tidy:${{ runner.temp }}/clang-tidy-version.txt
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log.txt
        ccache -z

        export AMREX_PETSC_HOME=${PWD}/petsc-3.22.2/petsc
        cd Tests/LinearSolvers/CellEB
        make -j4 USE_MPI=TRUE USE_PETSC=TRUE DIM=2 TEST=TRUE \
            CCACHE=ccache CXXSTD=c++20
        mpiexec -n 2 ./main2d.gnu.TEST.MPI.ex inputs.rt.2d.petsc

        ccache -s
        du -hs ~/.cache/ccache
    - name: Clang-tidy
      run: |
        ${{github.workspace}}/.github/workflows/clang-tidy/clang-tidy-ccache-misses.sh clang-tidy-21 \
            "--config-file=${{github.workspace}}/.clang-tidy --warnings-as-errors=*"
    - name: Save clang-tidy database
      if: ${{ !cancelled() }}
      uses: ./.github/actions/clang-tidy-db/save
      with:
        job-status: ${{ job.status }}
