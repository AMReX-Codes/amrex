name: smoke

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-smoke
  cancel-in-progress: true

permissions:
  actions: read  # clang-tidy database artifacts
  contents: read

jobs:
  check_changes:
    uses: ./.github/workflows/check_changes.yml

  multid:
    name: GNU Multi-D
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_non_docs_changes == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        .github/workflows/dependencies/dependencies_clang-tidy-apt-llvm.sh 21
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      env: {CXXFLAGS: "-fno-operator-names -Werror -Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual -Wnon-virtual-dtor -Wlogical-op -Wmisleading-indentation -Wduplicated-cond -Wduplicated-branches -Wmissing-include-dirs"}
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=100M
        export CCACHE_EXTRAFILES=${{ github.workspace }}/.clang-tidy
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log.txt
        ccache -z

        mkdir build
        cd build
        cmake ..                                  \
            -DCMAKE_CXX_STANDARD=20               \
            -DCMAKE_VERBOSE_MAKEFILE=ON           \
            -DAMReX_SPACEDIM="1;2;3"              \
            -DAMReX_EB=ON                         \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        make -j 4
        make install
        make test_install

        GH_TOKEN=${{ github.token }} \
        ${{github.workspace}}/.github/workflows/clang-tidy/clang-tidy-ccache-misses.sh clang-tidy-21 \
            "--config-file=${{github.workspace}}/.clang-tidy --warnings-as-errors=*"

        mkdir ../Tests/SpackSmokeTest/build
        cd ../Tests/SpackSmokeTest/build
        cmake .. \
            -DCMAKE_CXX_STANDARD=20               \
            -DCMAKE_VERBOSE_MAKEFILE=ON           \
            -DAMReX_ROOT=${PWD}/../../../installdir      \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        make -j 4
        mpiexec -n 2 ./install_test ../../Amr/Advection_AmrCore/Exec/inputs-ci

        ccache -s
        du -hs ~/.cache/ccache
    - name: Save clang-tidy database
      if: success()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: clang-tidy-db-${{ github.workflow }}-${{ github.job }}
        path: ${{ runner.temp }}/clang-tidy-db/out
        retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
        if-no-files-found: ignore
